<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#152238}.h{font-size:24px;font-weight:700}.b{font-size:16px}.s{font-size:13px;fill:#526175}.box{fill:#f6f8fb;stroke:#315c9b;stroke-width:2}.arr{stroke:#315c9b;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315c9b"/></marker></defs><text class="h" x="30" y="38">UNav: from a camera image to route instructions</text><rect class="box" x="30" y="85" width="180" height="90" rx="12"/><text class="b" x="55" y="120">Query image</text><text class="s" x="55" y="145">User camera view</text><line class="arr" x1="210" y1="130" x2="260" y2="130"/><rect class="box" x="260" y="85" width="190" height="90" rx="12"/><text class="b" x="285" y="116">NetVLAD</text><text class="s" x="285" y="140">Global descriptor</text><text class="s" x="285" y="160">retrieve similar images</text><line class="arr" x1="450" y1="130" x2="500" y2="130"/><rect class="box" x="500" y="85" width="220" height="90" rx="12"/><text class="b" x="525" y="116">SuperPoint / SuperGlue</text><text class="s" x="525" y="140">Local feature matches</text><text class="s" x="525" y="160">2D ↔ 3D correspondences</text><line class="arr" x1="720" y1="130" x2="770" y2="130"/><rect class="box" x="770" y="85" width="290" height="90" rx="12"/><text class="b" x="795" y="116">Position + orientation</text><text class="s" x="795" y="140">Weighted location estimate</text><text class="s" x="795" y="160">PnP estimates camera direction</text><line class="arr" x1="915" y1="175" x2="915" y2="235"/><rect class="box" x="770" y="235" width="290" height="90" rx="12"/><text class="b" x="795" y="270">Topometric map + Dijkstra</text><text class="s" x="795" y="294">Current node → destination</text><line class="arr" x1="770" y1="280" x2="720" y2="280"/><rect class="box" x="500" y="235" width="220" height="90" rx="12"/><text class="b" x="525" y="270">Route instructions</text><text class="s" x="525" y="294">Distance + turn guidance</text><text class="s" x="30" y="385">Original teaching diagram adapted from the UNav architecture described by Yang et al. (2022) [4].</text></svg>