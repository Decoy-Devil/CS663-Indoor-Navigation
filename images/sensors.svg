<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380"><style>.h{font:700 28px Arial;fill:#152238}.t{font:20px Arial;fill:#334155}.b{stroke-width:3}.c{fill:#eef4ff;stroke:#315c9b}.n{fill:#f3f4f6;stroke:#64748b}.y{fill:#f7f2e8;stroke:#8b6b2e}</style><text class="h" x="500" y="45" text-anchor="middle">Three sensor strategies</text><rect class="b c" x="45" y="90" rx="18" width="270" height="210"/><text class="h" x="180" y="135" text-anchor="middle">Camera-based</text><text class="t" x="180" y="180" text-anchor="middle">RGB / RGB-D / QR</text><text class="t" x="180" y="220" text-anchor="middle">Rich visual information</text><text class="t" x="180" y="260" text-anchor="middle">Sensitive to visibility</text><rect class="b n" x="365" y="90" rx="18" width="270" height="210"/><text class="h" x="500" y="135" text-anchor="middle">Non-camera</text><text class="t" x="500" y="180" text-anchor="middle">BLE / RFID / UWB</text><text class="t" x="500" y="220" text-anchor="middle">Can be robust</text><text class="t" x="500" y="260" text-anchor="middle">Often needs infrastructure</text><rect class="b y" x="685" y="90" rx="18" width="270" height="210"/><text class="h" x="820" y="135" text-anchor="middle">Hybrid</text><text class="t" x="820" y="180" text-anchor="middle">Camera + IMU + other</text><text class="t" x="820" y="220" text-anchor="middle">Combines strengths</text><text class="t" x="820" y="260" text-anchor="middle">More integration work</text><text class="t" x="500" y="350" text-anchor="middle">Categories follow the review taxonomy in [2].</text></svg>