<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390"><style>.h{font:700 26px Arial;fill:#152238}.t{font:18px Arial;fill:#334155}.b{fill:#f3f4f6;stroke:#64748b;stroke-width:2}</style><text class="h" x="500" y="45" text-anchor="middle">Why indoor vision can fail</text><g><rect class="b" x="55" y="85" rx="14" width="270" height="100"/><text class="h" x="190" y="125" text-anchor="middle">Lighting</text><text class="t" x="190" y="157" text-anchor="middle">darkness, glare, shadows</text><rect class="b" x="365" y="85" rx="14" width="270" height="100"/><text class="h" x="500" y="125" text-anchor="middle">Look-alike spaces</text><text class="t" x="500" y="157" text-anchor="middle">repeated corridors/doors</text><rect class="b" x="675" y="85" rx="14" width="270" height="100"/><text class="h" x="810" y="125" text-anchor="middle">Motion</text><text class="t" x="810" y="157" text-anchor="middle">blur and camera shake</text><rect class="b" x="210" y="225" rx="14" width="270" height="100"/><text class="h" x="345" y="265" text-anchor="middle">Occlusion/change</text><text class="t" x="345" y="297" text-anchor="middle">people, furniture, renovation</text><rect class="b" x="520" y="225" rx="14" width="270" height="100"/><text class="h" x="655" y="265" text-anchor="middle">Compute/network</text><text class="t" x="655" y="297" text-anchor="middle">latency, battery, connectivity</text></g><text class="t" x="500" y="370" text-anchor="middle">Challenges synthesized from [1], [2], [4], and [5].</text></svg>