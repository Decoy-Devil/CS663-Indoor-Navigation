<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430"><style>.t{font:700 22px Arial;fill:#152238}.s{font:17px Arial;fill:#334155}.e{stroke:#64748b;stroke-width:5}.n{fill:#eef4ff;stroke:#315c9b;stroke-width:4}</style><line class="e" x1="130" y1="210" x2="330" y2="100"/><line class="e" x1="130" y1="210" x2="330" y2="320"/><line class="e" x1="330" y1="100" x2="540" y2="210"/><line class="e" x1="330" y1="320" x2="540" y2="210"/><line class="e" x1="540" y1="210" x2="750" y2="210"/><text class="s" x="215" y="135">4</text><text class="s" x="215" y="300">2</text><text class="s" x="435" y="135">2</text><text class="s" x="435" y="300">3</text><text class="s" x="645" y="195">2</text><g><circle class="n" cx="130" cy="210" r="48"/><text class="t" x="130" y="218" text-anchor="middle">A</text><circle class="n" cx="330" cy="100" r="48"/><text class="t" x="330" y="108" text-anchor="middle">B</text><circle class="n" cx="330" cy="320" r="48"/><text class="t" x="330" y="328" text-anchor="middle">C</text><circle class="n" cx="540" cy="210" r="48"/><text class="t" x="540" y="218" text-anchor="middle">D</text><circle class="n" cx="750" cy="210" r="48"/><text class="t" x="750" y="218" text-anchor="middle">E</text></g><text class="s" x="450" y="400" text-anchor="middle">Dijkstra repeatedly expands the lowest-cost known node; in this example A→C→D→E costs 7.</text></svg>