<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330"><style>.t{font:700 22px Arial;fill:#152238}.s{font:17px Arial;fill:#334155}.b{fill:#f7f2e8;stroke:#8b6b2e;stroke-width:3}.a{stroke:#64748b;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><g><rect class="b" x="25" y="80" rx="15" width="160" height="110"/><text class="t" x="105" y="120" text-anchor="middle">QR node</text><text class="s" x="105" y="155" text-anchor="middle">known pose</text><line class="a" x1="185" y1="135" x2="235" y2="135"/><rect class="b" x="250" y="80" rx="15" width="160" height="110"/><text class="t" x="330" y="120" text-anchor="middle">Camera</text><text class="s" x="330" y="155" text-anchor="middle">reads marker</text><line class="a" x1="410" y1="135" x2="460" y2="135"/><rect class="b" x="475" y="80" rx="15" width="160" height="110"/><text class="t" x="555" y="120" text-anchor="middle">IMU fusion</text><text class="s" x="555" y="155" text-anchor="middle">tracks motion</text><line class="a" x1="635" y1="135" x2="685" y2="135"/><rect class="b" x="700" y="80" rx="15" width="130" height="110"/><text class="t" x="765" y="120" text-anchor="middle">Position</text><text class="s" x="765" y="155" text-anchor="middle">+ direction</text><line class="a" x1="830" y1="135" x2="870" y2="135"/><rect class="b" x="880" y="80" rx="15" width="95" height="110"/><text class="t" x="928" y="120" text-anchor="middle">Route</text><text class="s" x="928" y="155" text-anchor="middle">edges</text></g><text class="s" x="500" y="255" text-anchor="middle">QR nodes can serve as control points and road-network nodes; IMU supports continuous positioning between nodes [3].</text></svg>