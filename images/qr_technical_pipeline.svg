<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#152238}.h{font-size:24px;font-weight:700}.b{font-size:16px}.s{font-size:13px;fill:#526175}.box{fill:#f6f8fb;stroke:#315c9b;stroke-width:2}.arr{stroke:#315c9b;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315c9b"/></marker></defs><text class="h" x="30" y="38">QR + IMU: visual anchors correct inertial drift</text><rect class="box" x="30" y="90" width="175" height="90" rx="12"/><text class="b" x="52" y="122">Camera image</text><text class="s" x="52" y="148">QR near map node</text><line class="arr" x1="205" y1="135" x2="250" y2="135"/><rect class="box" x="250" y="90" width="180" height="90" rx="12"/><text class="b" x="275" y="122">ZBar</text><text class="s" x="275" y="148">Decode QR + corners</text><line class="arr" x1="430" y1="135" x2="475" y2="135"/><rect class="box" x="475" y="90" width="190" height="90" rx="12"/><text class="b" x="500" y="122">PnP / P3P</text><text class="s" x="500" y="148">Camera pose from 2D–3D</text><line class="arr" x1="665" y1="135" x2="710" y2="135"/><rect class="box" x="710" y="90" width="180" height="90" rx="12"/><text class="b" x="735" y="122">Absolute anchor</text><text class="s" x="735" y="148">Position + heading</text><rect class="box" x="250" y="245" width="180" height="90" rx="12"/><text class="b" x="275" y="277">PDR / IMU</text><text class="s" x="275" y="303">Steps + heading</text><line class="arr" x1="430" y1="290" x2="540" y2="290"/><line class="arr" x1="800" y1="180" x2="650" y2="245"/><rect class="box" x="540" y="245" width="190" height="90" rx="12"/><text class="b" x="565" y="277">EKF fusion</text><text class="s" x="565" y="303">Combine anchor + PDR</text><line class="arr" x1="730" y1="290" x2="780" y2="290"/><rect class="box" x="780" y="245" width="280" height="90" rx="12"/><text class="b" x="805" y="277">QR road network</text><text class="s" x="805" y="303">Nodes + edges → route planning</text><text class="s" x="30" y="385">Original teaching diagram adapted from Liu &amp; Zhang (2023) [3].</text></svg>