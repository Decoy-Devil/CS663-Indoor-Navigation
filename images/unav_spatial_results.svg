<svg xmlns="http://www.w3.org/2000/svg" width="900" height="435" viewBox="0 0 900 435"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif}</style><text x="20" y="34" font-size="26" font-weight="700" fill="#152238">UNav spatial performance</text><text x="20" y="60" font-size="15" fill="#526175">Lower values are better for all three measures.</text><rect x="650" y="22" width="18" height="18" rx="3" fill="#315c9b"/><text x="676" y="37" font-size="14">UNav</text><rect x="745" y="22" width="18" height="18" rx="3" fill="#8b6b2e"/><text x="771" y="37" font-size="14">SIPTD</text><text x="20" y="138" font-size="17" fill="#152238">Path efficiency</text><rect x="230" y="120" width="121.3" height="24" rx="4" fill="#315c9b"/><text x="361.3" y="138" font-size="15" fill="#152238">1.17</text><rect x="230" y="154" width="143.0" height="24" rx="4" fill="#8b6b2e"/><text x="383.0" y="172" font-size="15" fill="#152238">1.38</text><text x="20" y="233" font-size="17" fill="#152238">Wrong turns</text><rect x="230" y="215" width="50.8" height="24" rx="4" fill="#315c9b"/><text x="290.8" y="233" font-size="15" fill="#152238">0.49</text><rect x="230" y="249" width="203.2" height="24" rx="4" fill="#8b6b2e"/><text x="443.2" y="267" font-size="15" fill="#152238">1.96</text><text x="20" y="328" font-size="17" fill="#152238">Cane contacts</text><rect x="230" y="310" width="352.4" height="24" rx="4" fill="#315c9b"/><text x="592.4" y="328" font-size="15" fill="#152238">3.4</text><rect x="230" y="344" width="508.9" height="24" rx="4" fill="#8b6b2e"/><text x="748.9" y="362" font-size="15" fill="#152238">4.91</text><text x="20" y="420" font-size="13" fill="#526175">Recreated from published means in Yang et al. (2024) [5].</text></svg>